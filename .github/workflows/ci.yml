name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Locked restore
        run: dotnet restore Lokad.Image.slnx --locked-mode --tl:off
      - name: Offline correctness
        shell: pwsh
        run: ./test.ps1
      - name: Exact Release package consumer
        shell: pwsh
        run: ./tools/PackageSmokeTest/verify-package.ps1
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Provision pinned Linux tools and live oracle
        run: |
          # Route each suite directly; runner mirror lists can send security
          # indexes to an archive mirror whose package pool has not caught up.
          archive_uri=https://archive.ubuntu.com/ubuntu
          security_uri=https://security.ubuntu.com/ubuntu
          # Some runners cannot resolve ubuntu.com archive hosts, including
          # Azure's alias. Use an alternate mirror with Ubuntu signature checks.
          if ! getent ahosts archive.ubuntu.com >/dev/null || ! getent ahosts security.ubuntu.com >/dev/null; then
            archive_uri=https://mirrors.edge.kernel.org/ubuntu
            security_uri=$archive_uri
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $archive_uri
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: $security_uri
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          # Keep already installed tools; provisioning needs missing packages,
          # not unrelated upgrades from a temporarily inconsistent security pool.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-upgrade build-essential cmake pkg-config perl autoconf automake libtool xz-utils curl git python3 libicu74 libssl3t64 zlib1g ca-certificates
          bash tools/setup-linux.sh --jobs=4
      - name: Locked restore
        run: |
          source external/linux-x64/environment.sh
          dotnet restore Lokad.Image.slnx --locked-mode --tl:off
      - name: Live interoperability
        run: |
          source external/linux-x64/environment.sh
          pwsh -NoLogo -NoProfile -File ./test.ps1 -Differential
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-oracle-identity
          path: external/linux-x64/oracle-identity.json
